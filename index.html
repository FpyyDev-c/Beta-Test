<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScreenRoom — Compartilhe sua tela. Converse. Conecte-se.</title>
<meta name="description" content="Crie uma sala com um código de 5 caracteres e compartilhe sua tela em tempo real, sem cadastro." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233483fa%22/><circle cx=%225[...]
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/nitro.css" />
</head>
<body>
  <div class="landing">
    <div class="brand-mark"><span class="brand-dot"></span> ScreenRoom</div>

    <div class="hero">
      <div class="hero-eyebrow"><span class="brand-dot"></span> ao vivo, ponto a ponto</div>
      <h1>ScreenRoom</h1>
      <p class="tagline">Compartilhe sua tela. Converse. Conecte-se.</p>

      <div class="cta-row">
        <button class="btn btn-primary" id="btnCreate">🖥️ Criar sala</button>
        <button class="btn btn-secondary" id="btnJoinToggle">🔑 Entrar em sala</button>
      </div>

      <div class="join-box" id="joinBox">
        <input class="code-input" id="codeInput" placeholder="CÓDIGO" maxlength="5" autocomplete="off" />
        <button class="btn btn-primary" id="btnJoinGo">Entrar</button>
      </div>

      <p class="inline-error" id="inlineError"></p>

      <div class="hero-foot">
        <span>🔒 Sem cadastro</span>
        <span>⚡ WebRTC ponto a ponto</span>
        <span>👥 Até 10 pessoas por sala</span>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="nameModal">
    <div class="modal glass">
      <h3>Como você quer ser chamado?</h3>
      <p id="nameHint">Esse nome vai aparecer para todos na sala.</p>
      <input type="text" id="nameInput" placeholder="Seu nome" maxlength="30" autocomplete="off" />
      <button class="btn btn-primary" id="nameConfirm">Continuar</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nitro.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
